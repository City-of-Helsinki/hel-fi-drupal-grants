services:
  e2e:
    container_name: "${COMPOSE_PROJECT_NAME}-e2e"
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:-1.64.1}-noble
    ipc: host
    network_mode: host
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-""}
    working_dir: /app/e2e
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    profiles:
      - testing
  app:
    environment:
      XDEBUG_CONFIG: "log_level=0"
